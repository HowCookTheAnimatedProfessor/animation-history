<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Brief History of Animation Experience</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#253956;font:16px/1.55 system-ui,sans-serif}main{padding:clamp(22px,5vw,42px);max-width:580px;margin:24px auto;border-top:5px solid #8c7754;background:#fffdf8}h1{font:normal clamp(28px,6vw,40px)/1.15 Georgia,serif;margin:0 0 18px}p{margin:0 0 22px}a{display:inline-block;background:#253956;color:white;padding:15px 22px;border-radius:4px;text-decoration:none;font-weight:600;text-align:center}a:focus-visible{outline:3px solid #8c7754;outline-offset:4px}small{display:block;margin-top:18px;color:#4b5563}#desktop{display:none}#desktop iframe{display:block;width:100%;height:100vh;height:100dvh;border:0}body.desktop{background:#fff}body.desktop main{display:none}body.desktop #desktop{display:block}
</style>
</head>
<body>
<main><h1>A Brief History of Animation</h1><p>Explore the history of animation through an interactive journey of images, stories and moving pictures.</p><a href="./index.html" target="_blank" rel="noopener">Launch Interactive Experience ↗</a><small>When finished, return to Canvas using your browser tabs or app switcher.</small></main>
<section id="desktop" aria-label="Embedded animation history"><iframe id="experience" title="A Brief History of Animation" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></section>
<script>
(function(){var ua=navigator.userAgent;var mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);var touch=matchMedia('(pointer: coarse)').matches;var narrow=matchMedia('(max-width: 700px)').matches;if(!mobile&&!touch&&!narrow){document.body.classList.add('desktop');document.getElementById('experience').src='./index.html';}})();
</script>
</body></html>
